<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#0a0c10" />
    <title>GoldHEN</title>
    <style>
      :root {
        --bg: #0a0c10;
        --bg-elev: #11141a;
        --border: #1d222b;
        --text: #d7dde6;
        --text-dim: #7c8697;
        --accent: #6fe3a8;
        --danger: #e37a6a;
        --warn: #e3c46a;
        --font: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, "Helvetica Neue", sans-serif;
        --mono: "SF Mono", "JetBrains Mono", Consolas, "Roboto Mono", monospace;
        --radius: 14px;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.5 var(--font);
        -webkit-font-smoothing: antialiased;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      body::before {
        content: "";
        position: fixed;
        inset: -20%;
        background:
          radial-gradient(60% 50% at 50% 0%, rgba(111, 227, 168, 0.08), transparent 70%),
          radial-gradient(80% 60% at 50% 100%, rgba(120, 140, 200, 0.06), transparent 70%);
        pointer-events: none;
        z-index: 0;
      }

      #brand {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        padding: 18px 16px;
        border-bottom: 1px solid var(--border);
        background: rgba(17, 20, 26, 0.6);
        backdrop-filter: saturate(140%) blur(12px);
        -webkit-backdrop-filter: saturate(140%) blur(12px);
      }

      #brand b {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #eef2f8;
      }

      #brand span {
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--text-dim);
      }

      #stage {
        position: relative;
        z-index: 1;
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }

      .spinner {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        border: 2px solid rgba(111, 227, 168, 0.15);
        border-top-color: var(--accent);
        animation: spin 0.85s linear infinite;
        margin: 0 auto 22px;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .title {
        font-size: 17px;
        font-weight: 600;
        letter-spacing: 0.02em;
        margin: 0 0 6px;
        color: #eef2f8;
      }

      .subtitle {
        font-size: 13px;
        color: var(--text-dim);
        margin: 0;
      }

      #progress {
        width: 220px;
        height: 3px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.06);
        overflow: hidden;
        margin-top: 22px;
        position: relative;
      }

      #progress::after {
        content: "";
        position: absolute;
        inset: 0;
        width: 40%;
        background: linear-gradient(90deg, transparent, var(--accent), transparent);
        animation: slide 1.6s ease-in-out infinite;
        border-radius: 3px;
      }

      @keyframes slide {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(320%);
        }
      }

      #msg {
        display: none;
        font-size: 16px;
        font-weight: 600;
        color: var(--danger);
        margin-top: 4px;
        letter-spacing: 0.02em;
      }

      #stage.fail .spinner,
      #stage.fail .title,
      #stage.fail .subtitle,
      #stage.fail #progress {
        display: none;
      }

      #stage.fail #msg {
        display: block;
      }

      #log {
        display: none;
        flex: 1;
        padding: 14px 16px 20px;
        overflow: hidden;
        flex-direction: column;
        gap: 10px;
      }

      body.log #stage {
        display: none;
      }

      body.log #log {
        display: flex;
      }

      #state {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--text-dim);
        margin: 0;
      }

      #out {
        flex: 1;
        overflow-y: auto;
        background: var(--bg-elev);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 14px 16px;
        font: 12px/1.55 var(--mono);
        color: #a9b2c1;
        white-space: pre-wrap;
        word-break: break-word;
        scrollbar-width: thin;
        scrollbar-color: #2a3038 transparent;
      }

      #out::-webkit-scrollbar {
        width: 8px;
      }
      #out::-webkit-scrollbar-thumb {
        background: #2a3038;
        border-radius: 4px;
      }
      #out::-webkit-scrollbar-track {
        background: transparent;
      }

      .ok {
        color: var(--accent);
      }
      .bad {
        color: var(--danger);
      }
      .warn {
        color: var(--warn);
      }
      .safe {
        color: var(--accent);
      }
      .danger {
        color: var(--danger);
      }
      code {
        color: #9fb3d0;
      }
    </style>
  </head>
  <body>
    <div id="brand">
      <b>GOLDHEN PS4</b>
      <span>by GoldHEN</span>
    </div>

    <div id="stage">
      <div class="spinner"></div>
      <p class="title">Running exploit</p>
      <p class="subtitle">Do not close this page or turn off the console</p>
      <div id="progress"></div>
      <div id="msg">Close Your Browser</div>
    </div>

    <div id="log">
      <div id="state"></div>
      <div id="out"></div>
    </div>

    <script type="module">
      import "./jb.js?v=10";

      const NEW_TITLE = "GoldHEN";
      const NEW_BRAND_LINE1 = "GOLDHEN PS4";
      const NEW_BRAND_LINE2 = "by GoldHEN";

      function enforce() {
        if (document.title !== NEW_TITLE) document.title = NEW_TITLE;

        const brand = document.getElementById("brand");
        if (brand) {
          const b = brand.querySelector("b");
          const s = brand.querySelector("span");
          if (!b || !s || b.textContent !== NEW_BRAND_LINE1 || s.textContent !== NEW_BRAND_LINE2) {
            brand.innerHTML =
              "<b>" + NEW_BRAND_LINE1 + "</b><span>" + NEW_BRAND_LINE2 + "</span>";
          }
        }
      }

      setInterval(enforce, 200);
      enforce();
    </script>
  </body>
</html>
